<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>6mm Sticker Generator</title>
<style>
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f5f5f5; color: #222; margin: 0; padding: 0;
         display: flex; min-height: 100vh; }

  /* ---- sidebar ---- */
  .sidebar { width: 280px; min-width: 280px; background: #1e293b; color: #e2e8f0;
             padding: 16px; overflow-y: auto; border-right: 1px solid #334155; }
  .sidebar h2 { margin: 0 0 4px; font-size: 14px; color: #94a3b8;
                 text-transform: uppercase; letter-spacing: 0.05em; }
  .sidebar .hint { font-size: 11px; color: #64748b; margin: 0 0 12px; }
  .symbol-grid { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .symbol-item { display: flex; align-items: center; gap: 8px;
                 padding: 5px 8px; border-radius: 4px; cursor: default;
                 transition: background 0.15s; }
  .symbol-item:hover { background: #334155; }
  .symbol-item .icon { width: 36px; height: 36px; flex-shrink: 0; }
  .symbol-item .icon svg { width: 100%; height: 100%; }
  .symbol-item .label { min-width: 0; }
  .symbol-item .phrase { font-size: 12px; font-weight: 600; color: #f1f5f9;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .symbol-item .desc { font-size: 10px; color: #94a3b8;
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-loading { color: #64748b; font-size: 12px; padding: 12px 0; }

  /* ---- main ---- */
  .main { flex: 1; padding: 24px; display: flex; justify-content: center; align-items: flex-start; }
  .card { max-width: 640px; width: 100%; background: white; padding: 24px 28px;
          border: 1px solid #ddd; border-radius: 8px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.lede { margin: 0 0 20px; color: #666; }
  fieldset { border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px 16px;
             margin: 0 0 14px; }
  legend { padding: 0 6px; color: #555; font-size: 12px; text-transform: uppercase;
           letter-spacing: 0.04em; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 13px; }
  input[type=text], input[type=file], select {
    width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit;
    border: 1px solid #ccc; border-radius: 4px; background: white;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 14px; border-radius: 4px; cursor: pointer;
           border: 1px solid #2a4d8f; background: #2a4d8f; color: white; }
  button.secondary { background: white; color: #2a4d8f; }
  .hint { font-size: 12px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
  <aside class="sidebar">
    <h2>APP-6 Symbols</h2>
    <p class="hint">Use these phrases in the CSV <code>symbol</code> column.<br>
       Icons update when you change affiliation.</p>
    <div id="symbol-list" class="symbol-grid">
      <div class="sidebar-loading">Loading symbols…</div>
    </div>
  </aside>

  <div class="main">
    <form class="card" method="post" action="/generate" enctype="multipart/form-data">
      <h1>6mm Sticker Generator</h1>
      <p class="lede">Print unit-ID stickers for 6mm Team Yankee armies.</p>

      <fieldset>
        <legend>Army CSV</legend>
        <label for="csv_name">Bundled list</label>
        <select id="csv_name" name="csv_name">
          <option value="">— pick one —</option>
          {% for c in csvs %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
        <label for="csv_file">…or upload your own</label>
        <input type="file" id="csv_file" name="csv_file" accept=".csv,text/csv" />
        <div class="hint">Upload wins over the bundled selection.</div>
      </fieldset>

      <fieldset>
        <legend>Style</legend>
        <div class="row">
          <div>
            <label for="affiliation">Affiliation</label>
            <select id="affiliation" name="affiliation">
              {% for a in affiliations %}
              <option value="{{ a }}" {% if a == 'unknown' %}selected{% endif %}>{{ a }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label for="country">Country flag</label>
            <select id="country" name="country">
              <option value="">— none —</option>
              {% for f in flags %}
              <option value="{{ f }}">{{ f }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <label for="background">Background override (hex)</label>
        <input type="text" id="background" name="background" placeholder="#002F5F" pattern="#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?" />
        <div class="hint">Blank = affiliation default.</div>
      </fieldset>

      <fieldset>
        <legend>Output</legend>
        <label for="action">What to generate</label>
        <select id="action" name="action">
          <option value="preview">Preview HTML (one of each unique sticker)</option>
          <option value="stickers">Stickers — zip of per-base SVGs</option>
          <option value="sheets">Sheets — zip of A4 PDFs per formation</option>
        </select>
      </fieldset>

      <div class="actions">
        <button type="submit">Generate</button>
      </div>
    </form>
  </div>

  <script>
    const list = document.getElementById('symbol-list');
    const affSelect = document.getElementById('affiliation');

    async function loadSymbols() {
      const aff = affSelect.value;
      list.innerHTML = '<div class="sidebar-loading">Loading symbols\u2026</div>';
      try {
        const res = await fetch('/api/symbols?affiliation=' + encodeURIComponent(aff));
        const data = await res.json();
        list.innerHTML = '';
        for (const s of data) {
          const item = document.createElement('div');
          item.className = 'symbol-item';
          item.title = s.phrase + ' \u2014 ' + s.desc;
          item.innerHTML =
            '<div class="icon">' + s.svg + '</div>' +
            '<div class="label">' +
              '<div class="phrase">' + s.phrase + '</div>' +
              '<div class="desc">' + s.desc + '</div>' +
            '</div>';
          list.appendChild(item);
        }
      } catch (e) {
        list.innerHTML = '<div class="sidebar-loading">Failed to load symbols.</div>';
      }
    }

    affSelect.addEventListener('change', loadSymbols);
    loadSymbols();
  </script>
</body>
</html>
